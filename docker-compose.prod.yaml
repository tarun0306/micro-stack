
services:
  account_db: !reset null
  elasticsearch: !reset null

  account:
    image: ghcr.io/tarun0306/micro-stack-account:latest
    build: !reset null
    environment:
      DATABASE_URL: ${ACCOUNT_DATABASE_URL:?ACCOUNT_DATABASE_URL must be set}
    depends_on: !reset []
    volumes:
      - ./certs/global-bundle.pem:/certs/global-bundle.pem:ro

  order_db: !reset null

  product:
    image: ghcr.io/tarun0306/micro-stack-product:latest
    build: !reset null
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:?OPENSEARCH_URL must be set}
    depends_on: !reset []

  order:
    image: ghcr.io/tarun0306/micro-stack-order:latest
    build: !reset null
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL:?ORDER_DATABASE_URL must be set}
    depends_on: !reset []
    volumes:
      - ./certs/global-bundle.pem:/certs/global-bundle.pem:ro

  graphql:
    image: ghcr.io/tarun0306/micro-stack-graphql:latest
    build: !reset null

  frontend:
    image: ghcr.io/tarun0306/micro-stack-frontend:latest
    build: !reset null
