scalar Time

enum AccountRole {
  CUSTOMER
  OPERATOR
}

type Account {
    id : String!
    name: String!
    role: AccountRole!
    orders: [Order!]!
}
type Product {
  id: String!
  name: String!
  description: String!
  price: Float!
}

type Order {
  id: String!
  createdAt: Time!
  totalPrice: Float!
  products: [OrderedProduct!]!
}

type OrderedProduct {
  id: String!
  name: String!
  description: String!
  price: Float!
  quantity: Int!
}

input PaginationInput {
  skip: Int
  take: Int
}

input AccountInput {
  name: String!
  password: String!
}

input LoginInput {
  name: String!
  password: String!
}

type AuthPayload {
  token: String!
  account: Account!
}

input ProductInput {
  name: String!
  description: String!
  price: Float!
}

input OrderedProductInput {
  id: String!
  quantity: Int!
}

input OrderInput {
  accountId: String!
  products: [OrderedProductInput!]!
}

type Mutation {
  createAccount(account: AccountInput!): Account!
  login(credentials: LoginInput!): AuthPayload!
  createProduct(product: ProductInput!): Product!
  createOrder(order: OrderInput!): Order!
}

type Query {
  viewer: Account!
  accounts(pagination: PaginationInput, id: String): [Account!]!
  products(pagination: PaginationInput, query: String, id: String): [Product!]!
}